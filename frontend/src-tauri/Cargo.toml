[package]
name = "chabupelik-browser"
version = "1.0.0"
description = "Chabupelik Secure Browser"
authors = ["Chabupelik"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "webview-data-url"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

# Асинхронный рантайм и сеть
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
native-tls = "0.2"
url = "2.5"
urlencoding = "2.1"
bytes = "1.9"
byteorder = "1.5"
parking_lot = "0.12"

# Криптография (Zero-Knowledge AES-256-GCM + PBKDF2)
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# Сбор информации о системе для Device Fingerprint
sysinfo = "0.33"
dotenvy = "0.15.7"
